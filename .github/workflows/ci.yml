name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on a case-sensitive filesystem, so it catches path-case mismatches
  # that macOS hides, plus basic script hygiene.
  paths-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tracked paths resolve on a case-sensitive filesystem
        run: |
          test -f HiDeF.xcodeproj/project.pbxproj
          test -f HiDeF.xcodeproj/xcshareddata/xcschemes/HiDeF.xcscheme
          test -f Resources/IconSource/HiDeFIcon.svg
          test -f Resources/Demo/demo.h5
          test -f Sources/HDF5Shim/HiDeFHDF5.c
      - name: Shell syntax check
        run: bash -n Scripts/*.sh

  # Exercises the C shim against Homebrew HDF5 (no vendored XCFramework needed).
  smoke-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install HDF5
        run: brew install hdf5 pkgconf
      - name: Run smoke test
        run: HIDEF_USE_SYSTEM_HDF5=1 Scripts/smoke-test.sh

  # Builds the macOS app (unsigned) with the Xcode project. Needs the vendored
  # HDF5 XCFramework; it is cached keyed on the submodule commit.
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned HDF5 commit
        id: hdf5
        run: echo "sha=$(git ls-tree HEAD Vendor/hdf5 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Cache HDF5 XCFramework
        id: cache-xcframework
        uses: actions/cache@v6
        with:
          path: Vendor/Build/HDF5.xcframework
          key: hdf5-xcframework-${{ runner.os }}-${{ steps.hdf5.outputs.sha }}-${{ hashFiles('Scripts/build-hdf5-xcframework.sh') }}
      - name: Build HDF5 XCFramework
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 Vendor/hdf5
          Scripts/build-hdf5-xcframework.sh
      - name: Build macOS app (Xcode)
        run: |
          xcodebuild \
            -project HiDeF.xcodeproj \
            -scheme HiDeF \
            -sdk macosx \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Builds the iOS app for the simulator via the Xcode project. Needs the
  # vendored HDF5 XCFramework; it is cached keyed on the submodule commit.
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned HDF5 commit
        id: hdf5
        run: echo "sha=$(git ls-tree HEAD Vendor/hdf5 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Cache HDF5 XCFramework
        id: cache-xcframework
        uses: actions/cache@v6
        with:
          path: Vendor/Build/HDF5.xcframework
          key: hdf5-xcframework-${{ runner.os }}-${{ steps.hdf5.outputs.sha }}-${{ hashFiles('Scripts/build-hdf5-xcframework.sh') }}
      - name: Build HDF5 XCFramework
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 Vendor/hdf5
          Scripts/build-hdf5-xcframework.sh
      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project HiDeF.xcodeproj \
            -scheme HiDeF \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
